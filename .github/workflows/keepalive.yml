# Layer 2 of 4: GitHub Actions keep-alive (every 5 min)
# Pings the Render service to prevent free tier sleep
name: Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render service
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://ai-talent-bot.onrender.com/health" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Service alive (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Service responded with HTTP $HTTP_CODE"
            # Don't fail — service might be cold-starting
          fi

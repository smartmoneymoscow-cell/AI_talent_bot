name: Keep-Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render
        run: |
          for i in 1 2 3; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://ai-talent-hub.onrender.com/health" 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Alive (attempt $i)"
              exit 0
            fi
            echo "⚠️ Attempt $i: HTTP $HTTP, retrying..."
            sleep 5
          done
          echo "❌ Service unreachable after 3 attempts"
          exit 1

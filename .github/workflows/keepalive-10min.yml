# Layer 3 of 4: 10-minute keep-alive (cron-job.org equivalent)
name: Keep-Alive-10min
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render
        run: curl -s --max-time 30 "https://ai-talent-hub.onrender.com/health" || echo "cold start"

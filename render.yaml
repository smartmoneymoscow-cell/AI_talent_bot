services:
  - type: web
    name: ai-talent-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd mini_app/backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      - key: DB_PATH
        value: data/bot.db

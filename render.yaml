services:
  - type: web
    name: ai-talent-bot
    runtime: python
    plan: free
    buildCommand: "bash render_build.sh"
    startCommand: "bash render_start.sh"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      - key: DB_PATH
        value: /opt/render/project/src/data/bot.db
